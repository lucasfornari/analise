# Testes a cada push: tipos do catálogo, unitários (Node) e ponta a ponta (navegador real, bibliotecas do CDN).
# Só "push": com "pull_request" também, cada push num branch com PR aberto rodaria duas vezes.
# No main quem testa é o publicar.yml, sobre o pacote que vai ao ar.
name: Testes

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarios:
    name: Tipos e unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tipos
      - run: npm run test:unit

  e2e:
    name: Ponta a ponta (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-playwright
      # serve o repositório em /analise/, como o GitHub Pages, e carrega as libs do CDN real
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
