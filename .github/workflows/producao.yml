# Smoke test no site publicado: roda quando o "Publicar" termina com sucesso, diariamente
# (pega quebra de CDN mesmo sem mudança no código) e sob demanda.
# Confere que o site no ar mostra a última versão publicada (Release mais recente) e,
# após um deploy, exatamente o commit publicado.
name: Produção

on:
  workflow_run:
    workflows: [Publicar]
    types: [completed]
  schedule:
    - cron: '17 11 * * *'   # 08:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test no GitHub Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar-playwright
      - name: Define a URL e a versão esperadas
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_PUBLICADO: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "PAINEL_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          VERSAO=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "VERSAO_ESPERADA=$VERSAO" >> "$GITHUB_ENV"
          # só após um deploy há commit para conferir; no agendado vale a versão
          if [ -n "$COMMIT_PUBLICADO" ]; then echo "COMMIT_ESPERADO=$COMMIT_PUBLICADO" >> "$GITHUB_ENV"; fi
          echo "Esperado: $VERSAO ${COMMIT_PUBLICADO:-(qualquer commit)}"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: relatorio-producao
          path: |
            playwright-report/
            test-results/
          retention-days: 7
